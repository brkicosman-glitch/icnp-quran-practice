<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICNP Maktab — Qur'an Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">ICNP MAKTAB</div>
    <div class="subtitle">QUR'AN PRACTICE — FIRST 2 JUZ</div>
  </header>

  <main>
    <section class="controls">
      <button id="juz1" class="juz active">JUZ 1</button>
      <button id="juz2" class="juz">JUZ 2</button>
      <select id="pageSelect" aria-label="Select page"></select>
    </section>

    <section class="practice-bar">
      <button id="prevPage">← Previous</button>
      <div id="pageTitle">Page 1</div>
      <button id="nextPage">Next →</button>
    </section>

    <section id="ayahList" class="ayah-list">
      <div class="loading">Loading Qur'an page…</div>
    </section>

    <section class="credit">
      Qur'an text: Tanzil Project, Uthmani text. Used verbatim with attribution.
      <a href="https://tanzil.net/" target="_blank" rel="noopener">tanzil.net</a>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
